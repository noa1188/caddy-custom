name: Caddy Auto Sync & Build

on:
  schedule:
    - cron: '5 1 */3 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile

permissions:
  contents: write
  packages: write

jobs:
  sync:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check official version
        id: check
        run: |
          URL=https://api.github.com/repos/caddyserver/caddy/releases/latest
          TAG=$(curl -s $URL | jq -r .tag_name)
          OFFICIAL=${TAG#v}
          CUR=$(grep '^ARG CADDY_VERSION=' Dockerfile | cut -d= -f2)
          echo "official=$OFFICIAL" >> $GITHUB_OUTPUT
          echo "current=$CUR" >> $GITHUB_OUTPUT
          if [ "$CUR" != "$OFFICIAL" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VER=${{ steps.check.outputs.official }}
          sed -i "s/^ARG CADDY_VERSION=.*/ARG CADDY_VERSION=$VER/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: bump caddy"
          git push

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: ver
        run: |
          V=$(grep '^ARG CADDY_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Check if already released
        id: relcheck
        run: |
          URL=https://api.github.com/repos/${{ github.repository }}/releases/latest
          LATEST=$(curl -s $URL | jq -r .tag_name || echo "")
          echo "latest=$LATEST"
          if [ "$LATEST" = "${{ steps.ver.outputs.version }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.relcheck.outputs.skip == 'false'
        run: |
          V=${{ steps.ver.outputs.version }}
          U=${{ secrets.DOCKERHUB_USERNAME }}
          SRC=https://github.com/noa1188/caddy-custom
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg CADDY_VERSION=$V \
            -t $U/caddy-custom:$V \
            -t $U/caddy-custom:latest \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:$V \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:latest \
            --label org.opencontainers.image.source=$SRC \
            --label org.opencontainers.image.version=$V \
            --push .

      - name: Create Release
        if: steps.relcheck.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Caddy ${{ steps.ver.outputs.version }}
          generate_release_notes: true
