name: Caddy Auto Sync & Build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  schedule:
    - cron: '5 1 */3 * *' # 每 3 小时运行一次自动同步
  workflow_dispatch:       # 支持手动点击按钮触发构建

permissions:
  contents: write
  packages: write

jobs:
  # --- 任务 A: 自动同步 (仅在定时任务运行时执行) ---
  sync_version:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and Update Version
        run: |
          BASE_URL="https://api.github.com"
          REPO_PATH="/repos/caddyserver/caddy/releases/latest"
          REPO_URL="$BASE_URL$REPO_PATH"
          
          # 获取官方最新版本号
          LAST_TAG=$(curl -s "$REPO_URL" | jq -r .tag_name || echo "")
          OFFICIAL_VER=${LAST_TAG#v}
          echo "Official version: $OFFICIAL_VER"

          # 获取当前文件中的版本号
          CURRENT_VER=$(grep '^ARG CADDY_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')
          echo "Current version in Dockerfile: $CURRENT_VER"

          # 如果版本不一致，则更新并推送
          if [ "$OFFICIAL_VER" != "$CURRENT_VER" ] && [ -n "$OFFICIAL_VER" ]; then
            echo "New version detected! Updating Dockerfile..."
            sed -i "s/^ARG CADDY_VERSION=.*/ARG CADDY_VERSION=$OFFICIAL_VER/" Dockerfile
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Dockerfile
            git commit -m "chore: bump caddy to $OFFICIAL_VER [skip ci]"
            # 推送到 main 分支，这将触发下方的 build 任务
            git push origin HEAD:main
          else
            echo "No new version found. Skipping update."
          fi

  # --- 任务 B: 构建镜像 (当有推送或手动触发时执行) ---
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version Change
        id: vercheck
        run: |
          # 获取当前文件中的版本号
          CUR=$(grep '^ARG CADDY_VERSION=' Dockerfile \
            | cut -d= -f2 | tr -d '\r')
          
          # 获取我们上一次发布的 Release 版本号
          BASE_URL="https://api.github.com"
          REPO_PATH="/repos/${{ github.repository }}/releases/latest"
          REPO_URL="$BASE_URL$REPO_PATH"
          LAST_TAG=$(curl -s "$REPO_URL" | jq -r .tag_name || echo "")
          
          LAST_VER=""
          if [ -n "$LAST_TAG" ]; then
            LAST_VER=$(echo "$LAST_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          fi
          
          # 输出给后续步骤使用
          echo "last_release=$LAST_VER" >> $GITHUB_OUTPUT

          # 判断逻辑：
          # 如果是手动触发，或者当前版本与上次发布不符，则标记为 true
          IS_NEW=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [ "$CUR" != "$LAST_VER" ]; then
            IS_NEW=true
          fi
          
          if [ "$IS_NEW" = true ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "Current: $CUR, Last Release: $LAST_VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registries
        if: steps.vercheck.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.vercheck.outputs.changed == 'true'
        run: |
          V=$(grep '^ARG CADDY_VERSION=' Dockerfile \
            | cut -d= -f2 | tr -d '\r')
          
          U=${{ secrets.DOCKERHUB_USERNAME }}
          SRC=https://github.com/noa1188/caddy-custom
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg CADDY_VERSION=$V \
            -t $U/caddy-custom:$V \
            -t $U/caddy-custom:latest \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:$V \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:latest \
            --label org.opencontainers.image.source=$SRC \
            --label org.opencontainers.image.version=$V \
            --label org.opencontainers.image.description="Caddy with plugins" \
            --push .

      - name: Create GitHub Release
        if: steps.vercheck.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vercheck.outputs.last_release }}
          name: Caddy ${{ steps.vercheck.outputs.last_release }}
          generate_release_notes: true
