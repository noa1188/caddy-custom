name: Caddy Auto Sync & Build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Version and Decision
        id: vercheck
        run: |
          # Get current version from Dockerfile
          CUR=$(grep '^ARG CADDY_VERSION=' Dockerfile \
            | cut -d= -f2 | tr -d '\r')
          
          # Get our last release version
          BASE_URL="https://api.github.com"
          REPO_PATH="/repos/${{ github.repository }}/releases/latest"
          REPO_URL="$BASE_URL$REPO_PATH"
          LAST_TAG=$(curl -s "$REPO_URL" | jq -r .tag_name || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            # Extract version number like "2.8.4"
            LAST_VER=$(echo "$LAST_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            echo "last_release=$LAST_VER" >> $GITHUB_OUTPUT
          else
            echo "last_release=" >> $GITHUB_OUTPUT
          fi

          # Trigger build if current file version != last released version
          IS_NEW=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [ "$CUR" != "$(echo ${steps.vercheck.outputs.last_release})" ]; then
            IS_NEW=true
          fi
          
          if [ "$IS_NEW" = true ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "Current: $CUR"
          echo "Last Release: ${steps.vercheck.outputs.last_release}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.vercheck.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: steps.vercheck.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        if: steps.vercheck.outputs.changed == 'true'
        run: |
          V=$(grep '^ARG CADDY_VERSION=' Dockerfile \
            | cut -d= -f2 | tr -d '\r')
          
          U=${{ secrets.DOCKERHUB_USERNAME }}
          SRC=https://github.com/noa1188/caddy-custom
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg CADDY_VERSION=$V \
            -t $U/caddy-custom:$V \
            -t $U/caddy-custom:latest \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:$V \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:latest \
            --label org.opencontainers.image.source=$SRC \
            --label org.opencontainers.image.version=$V \
            --label org.opencontainers.image.description="Caddy with plugins" \
            --push .

      - name: Create GitHub Release
        if: steps.vercheck.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vercheck.outputs.last_release }}
          name: Caddy ${{ steps.vercheck.outputs.last_release }}
          generate_release_notes: true
