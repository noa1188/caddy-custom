name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: vercheck
        run: |
          CUR=$(grep '^ARG CADDY_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')
          PREV=$(git show HEAD~1:Dockerfile 2>/dev/null | grep '^ARG CADDY_VERSION=' | cut -d= -f2 | tr -d '\r' || true)
          if [ -n "$PREV" ] && [ "$CUR" != "$PREV" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "Caddy version: $CUR (previous: ${PREV:-<none>})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.vercheck.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: steps.vercheck.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile
        id: version
        run: |
          INPUT=${{ github.event.inputs.caddy_version }}
          if [ -n "$INPUT" ]; then
            V=$INPUT
          else
            V=$(grep 'ARG CADDY_VERSION=' Dockerfile | cut -d= -f2 | tr -d '\r')
          fi
          echo "caddy_version=$V" >> $GITHUB_OUTPUT
          echo "Caddy version: $V"

      - name: Print release version
        run: |
          echo "Release version: ${{ steps.version.outputs.caddy_version }}"

      - name: Build and push multi-arch
        if: steps.vercheck.outputs.changed == 'true'
        run: |
          V=${{ steps.version.outputs.caddy_version }}
          U=${{ secrets.DOCKERHUB_USERNAME }}
          SRC=https://github.com/noa1188/caddy-custom
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg CADDY_VERSION=$V \
            -t $U/caddy-custom:$V \
            -t $U/caddy-custom:latest \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:$V \
            -t ghcr.io/${{ github.repository_owner }}/caddy-custom:latest \
            --label org.opencontainers.image.source=$SRC \
            --label org.opencontainers.image.version=$V \
            --label org.opencontainers.image.description="Caddy with plugins" \
            --push .

      - name: Create GitHub Release
        if: steps.vercheck.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.caddy_version }}
          name: Caddy ${{ steps.version.outputs.caddy_version }}
          generate_release_notes: true
