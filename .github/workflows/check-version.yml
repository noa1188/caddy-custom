name: Check Caddy Version

on:
  schedule:
    - cron: '5 1 */3 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          V=$(grep 'ARG CADDY_VERSION=' Dockerfile | cut -d= -f2)
          VERSION=${V//$'\r'/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release
        id: latest
        run: |
          URL=https://api.github.com/repos/caddyserver/caddy/releases/latest
          LATEST=$(curl -s $URL | jq -r .tag_name)
          LATEST=${LATEST#v}
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Update Dockerfile if changed
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          VER=${{ steps.latest.outputs.version }}
          sed -i "s/^ARG CADDY_VERSION=.*/ARG CADDY_VERSION=$VER/" Dockerfile
          echo "Release version: $VER"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Dockerfile
          git commit -m "Bump Caddy to ${{ steps.latest.outputs.version }}"
          git push
